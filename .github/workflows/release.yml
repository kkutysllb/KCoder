name: Release

# 一键发布：推 tag 全自动三平台构建并发布（KStock 同款模式）。
# 本地只需：bash scripts/release.sh ship <版本>
# workflow_dispatch 仅作手动补跑入口（如某平台失败后重试）。
#
# ## 为什么不经 actions/artifact 中转（2026-10-10，参考 KStock 机制改）
#
# GitHub Actions 的**制品存储是账号级额度**：本账号下 KCoder 历史制品一度占到 61GB，
# 导致后续发布会卡在 `upload-artifact` → `Failed to CreateArtifact: Artifact storage
# quota has been hit.`（构建全绿、publish 被跳过）。KStock 在 v2.0.1 踩过同一个坑后
# 改为本工作流现在的形态：
#   prepare（建 Release 草稿）→ build 各平台构建完**直接 gh release upload** →
#   publish 只回填正文并把草稿转正。**中转文件为零**，不再消耗制品额度。
# 副作用是好的：资产在草稿期就可校验，失败重跑用 `--clobber` 覆盖同名资产即可。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建发布的 tag（如 v0.1.0，须已推送到远程）"
        required: true

# 最小权限：默认只读；需要写 Release 的三个 job 各自声明 contents: write。
permissions:
  contents: read

# 同一 tag 的发布串行（cancel-in-progress: false）：并发会互相覆盖 Release 资产。
concurrency:
  group: ${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备 Release（草稿）
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: release
      # 幂等：已存在（例如补跑）就复用；不存在才建草稿。草稿期间资产可自由挂载，
      # 最终由 publish job 转正，用户不会看到半成品 Release。复用也要刷新正文：
      # 草稿可能来自上一次失败/取消的运行，正文会停在那一刻的 release/<tag>.md。
      - name: 建 Release 草稿（幂等）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="release/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用"
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi
            exit 0
          fi
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --draft --title "KCoder ${TAG#v}" --notes-file "$NOTES"
          else
            echo "::warning::缺 $NOTES，先建空正文草稿（publish 会回填自动摘要）"
            gh release create "$TAG" --draft --title "KCoder ${TAG#v}" --notes "构建中（正文由 publish job 回填）"
          fi

  build:
    name: 构建 ${{ matrix.os }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # GitHub 没有 linux-* runner 标签，Linux 公共 runner 只有 ubuntu-*
        # （22.04 已在本项目验证全绿，且 glibc 更老对 deb 兼容性更好）
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发时用 tag 本身；手动触发时用输入的 tag
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          # 与上游 deepseek-harness 的 packageManager 及内置运行时 vendored
          # pnpm 保持同主版本（profile store 链接与 store 大版本一致，否则
          # ERR_PNPM_UNEXPECTED_STORE）。
          # 注意：这是**本仓自身步骤**（install/typecheck/build/打包）用的版本；
          # 所有「物化/构建上游」的步骤走 scripts/pnpm-pinned.mjs（按上游
          # packageManager 声明的精确版本执行），否则 CI 跑的不是上游声明的版本。
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装桌面端依赖
        run: pnpm install --frozen-lockfile
      - name: 克隆并构建上游 deepseek-harness
        # 上游克隆被 .gitignore 排除，CI 每次现拉现建（install + 三阶段 build）。
        # KCODER_UPSTREAM_DIR 必须指向 runner 工作区内：setup.sh 的默认值是本机
        # 仓外路径（/Users/...），runner 上无权创建会 Permission denied；且后续
        # deploy 步骤用相对路径 deepseek-harness，两者必须同址。
        timeout-minutes: 40
        env:
          KCODER_UPSTREAM_DIR: ${{ github.workspace }}/deepseek-harness
          # runner 无用户 SSH key，走匿名 HTTPS（fork 为公开仓）
          KCODER_UPSTREAM_REPO: https://github.com/kkutysllb/deepseek-harness.git
        run: |
          # 全局改写：克隆的 origin 及上游包内任何 git+ssh 依赖都转 HTTPS，
          # 否则后续 pnpm install/deploy 物化 git 依赖时仍会撞 SSH 无 key 失败
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          bash scripts/setup.sh
      - name: 物化上游运行时（开箱即用的核心）
        # pnpm deploy 生产依赖闭包 → staging/kcoder-runtime，
        # 再用 materialize-peers 补齐 deploy 的盲区（peer 声明 +
        # optionalDependencies 里的平台二进制）；目标必须用绝对路径。
        # macOS 上还会签名运行时内全部 Mach-O 二进制（公证硬要求：
        # Apple 会解开嵌套归档逐个校验）；CI 钥匙串无证书，从 p12 导入。
        timeout-minutes: 20
        env:
          # 仅 macOS 需要给运行时内 Mach-O 二进制签名（公证硬要求：Apple
          # 会解开嵌套归档逐个校验）。其他平台无 Mach-O，注入证书反而会
          # 污染后续产物（曾因全局 CSC_LINK 导致 Windows Setup exe 被
          # macOS 证书签名）。空字符串与未设置等价。
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PWD || '' }}
        run: |
          # 上游物化按上游 packageManager 声明的精确版本执行（scripts/pnpm-pinned.mjs 是
          # 唯一实现）；CI 顶部的 action-setup 版本只服务于本仓自身步骤。
          node scripts/pnpm-pinned.mjs --run "$PWD/deepseek-harness" -- --dir deepseek-harness --filter=@deepseek-ai/dsh deploy --prod --legacy "$PWD/staging/kcoder-runtime"
          test -f staging/kcoder-runtime/lib/bin.js
          node scripts/materialize-peers.mjs
      - name: 内置 provider 随包断言（CI 平价版）
        # release.sh build/verify 有同闸，但本工作流自己走 deploy +
        # materialize-peers，不经过 release.sh（与 verify-bundles-shipped 同款
        # 的 CI 平价约定）。0.6.19 现场：这 4 个 @deepseek-ai/dsh-*-ssh 未随包
        # ——用户侧 dsh 插件页报「异常」且整棵 pnpm 依赖图报废（详见
        # scripts/verify-runtime-providers.mjs 头注与 plans/ 的排查记录）。
        # 断归档而不是 staging 目录：随包的是归档。
        timeout-minutes: 5
        run: node scripts/verify-runtime-providers.mjs staging/kcoder-runtime.tar.gz
      - name: 品牌断言（fork 修复必须真实进产物）
        # 0.4.5 现场：tag 推送早于 fork push，CI 克隆到旧 fork 状态，
        # b11bd42095（chat.deepDiving 文案）未进产物——dev 现象与发布
        # 物脱节。断言在产物层硬拦：修复没随 kcoder/alpha.1 推送，
        # 发布直接红（与本地 release.sh 共用脚本）。
        timeout-minutes: 2
        run: node scripts/brand-assert.mjs staging/kcoder-runtime.tar.gz
      - name: 运行时冒烟（Electron node 形态 = 产物唯一解释器）
        # 产物解释器固定为 Electron 内置 node（内置运行时的原生模块已在
        # materialize-peers 的 ABI 对齐步按 Electron ABI 重编）；系统 node
        # 冒烟验证不了真机路径——v0.5.5 mac 发布即被「系统 node 冒烟绿、
        # Electron node 形态 fs-ext dlopen 崩」拦下。electron dist 若缺
        # （pnpm 构建脚本门未放行 postinstall）由 materialize-peers 自举。
        timeout-minutes: 5
        run: |
          ELECTRON_BIN="$(node -p 'require("electron")')"
          node scripts/smoke-runtime.mjs --dir "$PWD/staging/kcoder-runtime" --exec "$ELECTRON_BIN"
      - name: 构建桌面端产物（electron-vite build）
        run: pnpm exec electron-vite build
      - name: 打包安装包（macOS 签名 + 公证）
        if: runner.os == 'macOS'
        timeout-minutes: 60
        env:
          # 无签名 secrets 时绝不自动发现本机签名身份；显式身份名固定取
          # 下面的 CSC_NAME。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 签名钥匙串：复用 materialize-peers 已备好的
          # dsh-materialize.keychain-db（p12 导入 + 解锁 + partition-list
          # 完成，本 run 物化步已在同一 runner 用它签完运行时全部二进制）。
          # 不再给 electron-builder CSC_LINK 让它自建钥匙串：macos 镜像
          # 25.6.0 起 security set-key-partition-list 对自建钥匙串解锁报
          # SecKeychainUnlock not correct（v0.5.5 二次发布现场；25.5.0 同
          # 流程可用），而物化链同款命令同镜像可用。
          CSC_NAME: "Bing Li (DHV5D72JNF)"
          CSC_KEYCHAIN_PATH: ${{ github.workspace }}/dsh-materialize.keychain-db
          # notarization（electron-builder 三者齐全时自动公证）：
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # 内置运行时 node_modules 文件数上万，macOS runner 默认 256 句柄
          # 会在签名阶段撞 EMFILE： too many open files
          ulimit -n 65536 || true
          pnpm exec electron-builder --publish never
      - name: 打包安装包（Windows/Linux 无签名）
        if: runner.os != 'macOS'
        timeout-minutes: 60
        # 关键：不注入任何签名环境变量。曾把 macOS 证书（CSC_LINK）全局
        # 注入到所有平台，导致 Windows Setup exe 被 Apple Developer ID
        # 证书签名——证书链在 Windows 不可信（Authenticode NotValid），
        # electron-updater 校验 Status!=0 拒绝更新；且 app-update.yml 被
        # 写入 mac 证书 CN 作 publisherName（双重失败）。win/linux 无
        # 证书时不签名：app-update.yml 无 publisherName → electron-updater
        # 对 win 包自动跳过签名校验（NsisUpdater.verifySignature 空配置放行）。
        run: pnpm exec electron-builder --publish never
      - name: 校验内置 bundle 随包（extraResources 漂移拦截）
        # release.sh verify 1.7 的 CI 平价版：bundle/ ↔ 包内 resources 逐
        # 目录对账 + profile-patches 对账。bundle/dsh-file-attach 漏配
        # extraResources 连续五个版本没拦住（0.5.1-0.5.5，Windows 全新
        # 安装引擎启动即崩 cannot resolve profile bundle）——本地 verify
        # 有此闸，CI-only 发布链没有
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS)
              RESOURCES="$(find dist -maxdepth 4 -type d -path '*KCoder.app/Contents/Resources' | head -1)" ;;
            Windows)
              RESOURCES="dist/win-unpacked/resources" ;;
            Linux)
              RESOURCES="dist/linux-unpacked/resources" ;;
          esac
          node scripts/verify-bundles-shipped.mjs "$RESOURCES"
      - name: 校验 macOS 签名与公证（防静默发布损坏包）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_BUNDLE="$(find dist -maxdepth 3 -name 'KCoder.app' -type d | head -1)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::未找到 KCoder.app，无法校验签名"
            exit 1
          fi
          echo "=== 签名身份 ==="
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -E "Signature|TeamIdentifier|Authority" || true
          if codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::产物是 adhoc 签名 —— MAC_CERTIFICATE secrets 未生效"
            exit 1
          fi
          if codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "::error::产物无 TeamIdentifier —— 证书未生效"
            exit 1
          fi
          echo "=== Gatekeeper 评估 ==="
          spctl -a -vv "$APP_BUNDLE" 2>&1 | tail -3
          echo "=== 公证票据 ==="
          xcrun stapler validate "$APP_BUNDLE" 2>&1 || {
            echo "::error::产物未公证 —— APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID secrets 未生效"
            exit 1
          }
          echo "macOS 产物签名与公证校验通过"
      - name: Electron node 形态冒烟（真机启动路径）
        # v0.1.0 真机首启 crash-loop 的教训：系统 node 冒烟绿但真机挂
        # （GUI 启动 PATH 无系统 node，回退 Electron 内置 node 后 HMR 的
        # internal loader 链路不同）。必须用打包产物主二进制实际起服。
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_BUNDLE="$(find dist -maxdepth 3 -name 'KCoder.app' -type d | head -1)"
          XDIR="$(mktemp -d)"
          tar -xzf "$APP_BUNDLE/Contents/Resources/kcoder-runtime.tar.gz" -C "$XDIR"
          node scripts/smoke-runtime.mjs --dir "$XDIR" --exec "$APP_BUNDLE/Contents/MacOS/KCoder"
          rm -rf "$XDIR"
      - name: 收集安装包
        run: |
          mkdir -p dist-release
          # electron-builder 产物在 dist/。按扩展名收集所有安装包 +
          # updater 元数据，不依赖文件名前缀。blockmap 是 electron-updater
          # 增量更新的元数据，latest*.yml 是自动更新的发现入口，必须随包分发。
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} dist-release/ \;
          ls -lh dist-release
      # 直接挂到 Release（不经 upload-artifact）：见文件头「为什么不经 artifact 中转」。
      # --clobber 让补跑可覆盖同名资产；三平台并行写同一 Release（文件名不同）互不冲突。
      - name: 上传安装包到 Release（幂等）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 引擎偶发 5xx/网络抖动时重试一次（与 KStock 同款兜底）。
          gh release upload "$TAG" dist-release/* --clobber || gh release upload "$TAG" dist-release/* --clobber

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 发布正文来自仓内发布说明（约定见 release/README.md：每个版本一个
      # release/v<版本>.md，随 release 提交入库）；说明缺失时回退自动摘要。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: release
      - name: 准备发布说明正文
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -f "release/$TAG.md" ]; then
            cp "release/$TAG.md" /tmp/release-notes.md
          else
            echo "::warning::缺 release/$TAG.md，回退自动生成的变更摘要（约定见 release/README.md）"
            : > /tmp/release-notes.md
          fi
      # 安装包已由各构建 job 直接挂上（本步不再传 files）：这里只补正文并把草稿转正。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # 明确 draft: false —— 草稿由 prepare 建、资产由 build 挂，本步转正。
          draft: false
          body_path: /tmp/release-notes.md
          generate_release_notes: true
      # 幂等兜底：正文以 release/<tag>.md 为唯一事实源（KStock v2.0.2 实证：同名 tag
      # 下有多条草稿时，softprops 可能转正另一条，终态正文会停在旧版本）。
      - name: 正文以 release/<tag>.md 为准（幂等兜底）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -s /tmp/release-notes.md ]; then gh release edit "$TAG" --notes-file /tmp/release-notes.md; fi