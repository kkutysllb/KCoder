name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio croniter

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests -v

      - name: Byte-compile check
        run: python -m compileall -q qilin app
