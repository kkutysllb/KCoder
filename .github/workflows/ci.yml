name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio croniter mypy==2.3.0

      - name: Lint
        run: ruff check .

      # mypy gate for the clean modules (4b backlog: agents/community/runtime
      # are still excluded until their errors are worked off -- see
      # docs/mypy_backlog.md). --follow-imports=silent stops errors in those
      # excluded modules from leaking into this gate while still type-checking
      # every statement in the listed modules.
      - name: Type check (clean-module gate)
        run: |
          mypy --follow-imports=silent \
            qilin/authz qilin/config qilin/guardrails qilin/integrations \
            qilin/mcp qilin/models qilin/orchestration qilin/persistence \
            qilin/reflection qilin/sandbox qilin/scheduler qilin/skills \
            qilin/subagents qilin/tools qilin/tracing qilin/uploads \
            qilin/utils qilin/workspace_changes \
            qilin/client.py qilin/checkpoint_patches.py \
            qilin/runtime/checkpoint_mode.py qilin/runtime/checkpoint_state.py \
            qilin/runtime/user_context.py qilin/runtime/secret_context.py

      - name: Unit tests
        run: pytest tests -v

      - name: Byte-compile check
        run: python -m compileall -q qilin app
