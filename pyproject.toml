[project]
name = "qilin"
version = "1.0.0"
description = "QiLin agent harness framework"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "agent-client-protocol>=0.4.0",
    "agent-sandbox>=0.0.30",
    "croniter>=6.0.0",
    "dotenv>=0.9.9",
    "exa-py>=1.0.0",
    "httpx>=0.28.0",
    "kubernetes>=30.0.0",
    "langchain>=1.3",
    "langchain-anthropic>=1.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=3.4.1",
    "langgraph>=1.2.9,<1.3",
    "langgraph-api>=0.8.1",
    "langgraph-cli>=0.4.24",
    "langgraph-runtime-inmem>=0.28.0",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "mcp>=1.29.0",
    "packaging>=26.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "tavily-python>=0.7.17",
    "firecrawl-py>=1.15.0",
    "tiktoken>=0.8.0",
    "ddgs>=9.10.0",
    "defusedxml>=0.7.1",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    "langgraph-checkpoint-sqlite>=3.1.0,<3.2",
    "langgraph-sdk>=0.1.51",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "cryptography>=48.0.1",
    "e2b-code-interpreter>=2.8.0",
]

[project.scripts]
qilin = "qilin.tui.cli:main"

[project.optional-dependencies]
tui = ["textual>=0.80"]
groundroute = []
ollama = ["langchain-ollama>=0.3.0"]
gateway = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "PyJWT>=2.13.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]
channels = [
    "dingtalk-stream>=0.24.3",
    "discord-py>=2.7.1",
    "lark-oapi>=1.7.2",
    "markdown-to-mrkdwn>=0.3.3",
    "python-telegram-bot>=22.8",
    "slack-sdk>=3.43.0",
]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=3.1.0,<3.2",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
redis = ["redis>=5.0.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
boxlite = ["boxlite>=0.9.7"]
tenki = ["tenki-sandbox>=0.4.0"]
monocle = ["monocle_apptrace>=0.8.8"]
browser = ["playwright>=1.40"]
memory-zh = ["jieba>=0.42.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qilin"]

# ---------------------------------------------------------------------------
# Code-quality gate: pytest / mypy
# (ruff config lives in ruff.toml)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["qilin/agents/memory/backends/qilinmem/", "dist/"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
