appId: com.kcoder.app
productName: KCoder
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - "!**/*.map"
extraResources:
  # 开箱即用的核心：上游运行时（pnpm deploy + peer 补齐 + flatten +
  # 瘦身）以单文件 tar.gz 随包分发，首启解压到 userData（见
  # dsh-contract.ts ensureBundledRuntime）。不走散文件目录：electron-
  # builder 复制/签名数万文件会撞 macOS EMFILE。由 scripts/release.sh
  # build 物化到 staging/kcoder-runtime.tar.gz。
  - from: staging/kcoder-runtime.tar.gz
    to: kcoder-runtime.tar.gz
  # KCoder 自有 dsh bundle：主进程启动时幂等物化到
  # $DSH_HOME/profiles/web/node_modules 并注册层叠（kcoder-skills-bundle.ts）
  # —— dsh-skills-bundle（方法论技能包）/ dsh-language-bundle（强制中文回答
  # system-prompt section，默认 disabled，home patch 层热切换）/
  # dsh-git-panel（独立 git 工作区面板）/ dsh-terminal（嵌入式终端）
  # / dsh-stats-panel（会话统计图表面板，hover 缩略条底部弹出）；
  # 全部 dsh 标准命名（2026-09-01 改名自立，原 @kcoder/*）
  - from: bundle/dsh-skills-bundle
    to: dsh-skills-bundle
  - from: bundle/dsh-language-bundle
    to: dsh-language-bundle
  - from: bundle/dsh-git-panel
    to: dsh-git-panel
  - from: bundle/dsh-terminal
    to: dsh-terminal
  - from: bundle/dsh-stats-panel
    to: dsh-stats-panel
  # dsh-file-attach（文件/文件夹附件，包名 @kkutysllb/dsh-file-attach；
  # 真源同名独立仓，sync-bundles 经 dsh-plugins 镜像同步产物）。
  # ⚠️ 0.5.1-0.5.5 漏配本映射：打包应用 resources 源缺失 → 物化静默
  # 跳过，引用此 bundle 的 profile 引擎启动即崩（cannot resolve profile
  # bundle），CI 无 bundle 对账闸一直没拦住（2026-09-05 Windows 现场）。
  # CI 侧对账闸见 release.yml 的 verify-bundles-shipped 步
  - from: bundle/dsh-file-attach
    to: dsh-file-attach
  # dsh-file-review-kcoder（改动审查，完全自立维护；血缘
  # left0ver/dsh-file-review；真源同名独立仓，sync-bundles.mjs 同步产物）
  - from: bundle/dsh-file-review-kcoder
    to: dsh-file-review-kcoder
  # dsh-coding-sidebar（侧边栏工作台自立包，fork 自
  # DSH-better-sidebar 0.17.2，底面板移除；真源 kkutysllb/dsh-coding-sidebar，
  # 两级镜像 dsh-plugins → 仓库 bundle/，sync-bundles.mjs 同步）——
  # profile deps 的 ^1.0.0 仅牵引依赖树，实体由 kcoder-skills-bundle
  # 物化覆盖为终态，index.ts 在 preset install 后二调
  # ensureKcoderBundles 兑现纠偏。目录级映射：产物更新落仓库即随包，
  # release.sh verify 与仓库清单逐文件对账防断供
  - from: bundle/dsh-coding-sidebar
    to: dsh-coding-sidebar
  # 插件热补丁（name-only patchedDependencies，主进程启动时幂等物化进
  # $DSH_HOME/profiles/web，声明跟随 deps 实态自愈，见 profile-patches.ts）：
  # video-preview 扩展表删 ts（0.3.5 误判退役后复役）；dsh-context RO
  # 回路冷却。目录级映射：新增补丁落仓库即随包，release.sh
  # verify 与仓库清单逐文件对账防断供。Windows 无 launchd，随包分发是
  # 补丁的唯一通道。
  # coding-sidebar 另有产品侧物化见 preset-plugins.ts（node-pty 构建许可
  # + 面板顶部避让；开关簇由 sidebar-cluster.ts 状态栏代理接管）
  - from: profiles/web/patches
    to: profile-patches
  # scripts 与 assets（官方图标）随应用分发，供首次引导与托盘使用
  - from: scripts
    to: scripts
    filter: ["*.sh"]
  - from: assets
    to: assets
    filter: ["*.png", "*.svg"]
asarUnpack:
  - "**/*.sh"
  # 原生模块（node-pty 的 .node 二进制不能进 asar）
  - "node_modules/node-pty/**"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.png
  # 产物名固定无空格（productName 带空格时：builder 写 latest-mac.yml
  # 把空格换 "-"，GitHub 上传 asset 把空格换 "."，三方不一致 → 自动
  # 更新下载 404；v0.1.1/v0.1.2 均中招，靠手改 yml 急救过）。
  # zip/dmg 同名异扩展，无冲突
  artifactName: KCoder-${version}-${arch}.${ext}
  minimumSystemVersion: '13.0'
  # Hardened Runtime（检测到 Developer ID 证书时 builder 默认启用）必须
  # 配套签入 Electron 官方 mac 四件套豁免，缺 allow-jit 时 V8 启动初始化
  # 期的 CodeRange/JIT 内存预留会被内核直接拒绝：主进程报 Fatal process
  # out of memory: Failed to reserve virtual memory for CodeRange 后
  # SIGTRAP 崩溃（v0.2.7 本地构建中招；dev 的 adhoc 签名无 Hardened
  # Runtime，故开发环境从不复现）。两个文件存在时 builder 也会自动拾取
  # （默认路径），这里显式声明并留痕。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 正式发布的包必须公证（未公证的 Developer ID 应用会被用户机器的
  # Gatekeeper 拦截）。凭据走 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID 环境变量——缺任一 electron-builder 会直接构建失败，
  # 防止无公证包流出（scripts/release.sh build 会提前拦截并提示）。
  notarize: true
dmg:
  title: KCoder ${version}
linux:
  target: [AppImage, deb]
  category: Development
  # 同 mac：无空格产物名（deb 内部包名仍来自 name 字段，不受影响）
  artifactName: KCoder-${version}.${ext}
win:
  target: [nsis]
  # 同 mac：无空格产物名（默认 " productName Setup " 带空格同样中招）
  artifactName: KCoder-Setup-${version}.${ext}
# 自动更新源：GitHub Releases（electron-updater 读取随包生成的 app-update.yml）
publish:
  provider: github
  owner: kkutysllb
  repo: KCoder
  releaseType: release
