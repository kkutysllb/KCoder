appId: com.kcoder.app
productName: KCoder
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - "!**/*.map"
extraResources:
  # 开箱即用的核心：上游运行时（pnpm deploy + peer 补齐 + flatten +
  # 瘦身）以单文件 tar.gz 随包分发，首启解压到 userData（见
  # dsh-contract.ts ensureBundledRuntime）。不走散文件目录：electron-
  # builder 复制/签名数万文件会撞 macOS EMFILE。由 scripts/release.sh
  # build 物化到 staging/kcoder-runtime.tar.gz。
  - from: staging/kcoder-runtime.tar.gz
    to: kcoder-runtime.tar.gz
  # KCoder 自有 dsh bundle：主进程启动时幂等物化到
  # $DSH_HOME/profiles/web/node_modules 并注册层叠（kcoder-skills-bundle.ts）
  # —— kcoder-skills（方法论技能包）/ kcoder-language（强制中文回答
  # system-prompt section，默认 disabled，home patch 层热切换）/
  # kcoder-git-panel（独立 git 工作区面板）/ kcoder-terminal（嵌入式终端）
  - from: bundle/kcoder-skills
    to: kcoder-skills
  - from: bundle/kcoder-language
    to: kcoder-language
  - from: bundle/kcoder-git-panel
    to: kcoder-git-panel
  - from: bundle/kcoder-terminal
    to: kcoder-terminal
  # kcoder-file-review（文件审查，fork 自 Lzh3070/dsh-file-review-tab）
  - from: bundle/kcoder-file-review
    to: kcoder-file-review
  # 插件热补丁（name-only patchedDependencies，主进程启动时幂等物化进
  # $DSH_HOME/profiles/web，声明跟随 deps 实态自愈，见 profile-patches.ts）：
  # drag-to-attachment 漏 return / 复制·就地编辑增强；video-preview 扩展表
  # 删 ts（0.3.5 误判退役后复役，详见 profile-patches.ts）。目录级映射：新增补丁落仓库即随包，release.sh
  # verify 与仓库清单逐文件对账防断供。Windows 无 launchd，随包分发是
  # 补丁的唯一通道。
  # better-sidebar 另有产品侧物化见 preset-plugins.ts（node-pty 构建许可
  # + 面板顶部避让；开关簇由 sidebar-cluster.ts 状态栏代理接管）
  - from: profiles/web/patches
    to: profile-patches
  # scripts 与 assets（官方图标）随应用分发，供首次引导与托盘使用
  - from: scripts
    to: scripts
    filter: ["*.sh"]
  - from: assets
    to: assets
    filter: ["*.png", "*.svg"]
asarUnpack:
  - "**/*.sh"
  # 原生模块（node-pty 的 .node 二进制不能进 asar）
  - "node_modules/node-pty/**"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.png
  # 产物名固定无空格（productName 带空格时：builder 写 latest-mac.yml
  # 把空格换 "-"，GitHub 上传 asset 把空格换 "."，三方不一致 → 自动
  # 更新下载 404；v0.1.1/v0.1.2 均中招，靠手改 yml 急救过）。
  # zip/dmg 同名异扩展，无冲突
  artifactName: KCoder-${version}-${arch}.${ext}
  minimumSystemVersion: '13.0'
  # Hardened Runtime（检测到 Developer ID 证书时 builder 默认启用）必须
  # 配套签入 Electron 官方 mac 四件套豁免，缺 allow-jit 时 V8 启动初始化
  # 期的 CodeRange/JIT 内存预留会被内核直接拒绝：主进程报 Fatal process
  # out of memory: Failed to reserve virtual memory for CodeRange 后
  # SIGTRAP 崩溃（v0.2.7 本地构建中招；dev 的 adhoc 签名无 Hardened
  # Runtime，故开发环境从不复现）。两个文件存在时 builder 也会自动拾取
  # （默认路径），这里显式声明并留痕。
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 正式发布的包必须公证（未公证的 Developer ID 应用会被用户机器的
  # Gatekeeper 拦截）。凭据走 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID 环境变量——缺任一 electron-builder 会直接构建失败，
  # 防止无公证包流出（scripts/release.sh build 会提前拦截并提示）。
  notarize: true
dmg:
  title: KCoder ${version}
linux:
  target: [AppImage, deb]
  category: Development
  # 同 mac：无空格产物名（deb 内部包名仍来自 name 字段，不受影响）
  artifactName: KCoder-${version}.${ext}
win:
  target: [nsis]
  # 同 mac：无空格产物名（默认 " productName Setup " 带空格同样中招）
  artifactName: KCoder-Setup-${version}.${ext}
# 自动更新源：GitHub Releases（electron-updater 读取随包生成的 app-update.yml）
publish:
  provider: github
  owner: kkutysllb
  repo: KCoder
  releaseType: release
