services:
  postgres-engine-test:
    image: postgres:17
    environment:
      POSTGRES_DB: qiongqi
      POSTGRES_USER: qiongqi
      POSTGRES_PASSWORD: qiongqi
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiongqi -d qiongqi"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
