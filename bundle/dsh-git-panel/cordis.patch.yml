# @kkutysllb/dsh-git-panel bundle layer（KCoder 桌面端内置 git 工作区面板）。
#
# 声明于 package.json 的 dsh.bundle.patch，由 KCoder 主进程物化到
# web profile 的 node_modules 并注册进 dsh.profile.bundles（紧跟
# dsh-web-app 之后）。本层只挂一个胶水插件（entry.js）：激活时注册
# 只读 git 快照 RPC（/dsh-git-panel/api/snapshot 与 open-plan 回退）；
# client 交付物（exports["./client"] → client.js）由 dsh client-modules
# 自动集成，在 shell 页面渲染独立浮动面板 + 标题栏开关按钮。
# 后续层（profile 自身 cordis.patch.yml、--patch 覆盖）可按行 id
# 覆写或禁用本行。

- insert:
    - id: '@kkutysllb/dsh-git-panel'
      name: '@kkutysllb/dsh-git-panel'
