# dsh-stats-panel bundle 层（KCoder 会话统计图表面板）。
#
# 声明于 package.json 的 dsh.bundle.patch，由 KCoder 主进程物化到
# web profile 的 node_modules 并注册进 dsh.profile.bundles（紧跟
# dsh-web-app 之后）。本层只挂一个占位插件（entry.js，纯 client
# 交付物无 server 依赖）；client 交付物（exports["./client"] →
# client.js）由 dsh client-modules 自动集成，在 shell 页面把输入框
# 下方 StatsLine 缩略条的 hover 升级为底部弹出的自绘统计面板。
# 后续层（profile 自身 cordis.patch.yml、--patch 覆盖）可按行 id
# 覆写或禁用本行。

- insert:
    - id: dsh-stats-panel
      name: 'dsh-stats-panel'
