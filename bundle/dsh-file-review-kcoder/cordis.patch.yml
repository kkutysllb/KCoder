# No ui-deliverables row here: since 0.5.0 this fork CLAIMS the built-in
# plugin's `deliverables` turn data instead of registering its own Definition,
# so the built-in ui-deliverables must stay ENABLED. (0.4.x shipped
# `- id: ui-deliverables / disabled: true` to keep the two Definitions from
# colliding — leaving that row in silently starved the card claim AND the
# built-in tail: the tab went empty and every turn-tail row vanished.)
#
# Since dsh 0.1.5-alpha.2 that turn data also carries the `present` tool's
# explicit deliveries (`presented`), and the built-in row renders them as
# cards. The turn-tail slot is a CHAIN (first non-null selector owns the whole
# row), so the claim reads both faces and the registered `Deliverables`
# component renders both sections — see src/client/Deliverables.tsx. The
# built-in plugin must therefore stay enabled for a second reason: its node
# half owns the authenticated /api/present.host and /api/present.open routes
# the delivery cards use. Composing it out removes the guidance, the row, the
# prose links, AND those routes; this plugin then degrades to Sidebar-preview
# only, without failing.
- insert:
    - id: file-review-tab
      name: 'dsh-file-review-kcoder'
