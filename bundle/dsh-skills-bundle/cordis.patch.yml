# dsh-skills-bundle bundle layer（KCoder 桌面端内置技能包）。
#
# 声明于 package.json 的 dsh.bundle.patch，由 KCoder 主进程物化到
# web profile 的 node_modules 并注册进 dsh.profile.bundles（紧跟
# dsh-web-app 之后）。本层只挂一个胶水插件：激活时扫描包内 skills/
# 目录，把适配自 KSkills 仓库的方法论技能注册为 runtime skill
# （rank 250，项目级 .dsh/skills 同名技能可覆盖）。
# 后续层（profile 自身 cordis.patch.yml、--patch 覆盖）可按行 id
# 覆写或禁用本行。

- insert:
    - id: kcoder-skills
      name: 'dsh-skills-bundle'
