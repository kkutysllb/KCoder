# 插件契约断言（KCoder 仓 docs/plugin-dev-checklist.md §1 / §3 的执行点）。
#
# 两条规则都只能在这里查——KCoder 侧看的是**压缩后的 bundle**，读不出 `ctx.remote.x`
# 这样的源码形态：
#   ① 可选面（服务 / remote 面）只能走 ctx.get / ctx.inject：直接读 `ctx.remote.<面>`
#      会被 cordis 的 inject 强制校验拦下并抛异常；写进 inject 又因 all-required 让插件
#      在缺少该面的载具上整体不挂载。
#   ② `openTab` 要「点了能看见」就必须带 meta：纯 type 的 open 是静默落位，面板收起时
#      用户看不到任何变化（v0.6.17 现场：点任务卡「打开」像是没反应）。确实要有意
#      type-only 的调用点必须就地标注 `// open-tab:type-only — <理由>`。
#
# 同一支脚本也挂在 `pnpm test` 与 `prepack`（发布前必过）上。
name: Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: 可选面读法 + openTab 定性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 本仓 package.json 没有 packageManager 字段，必须显式给版本；
          # 用与本地/锁文件同大版本（本机 pnpm v11.x），否则 --frozen-lockfile 会因锁文件版本不符而失败。
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13（setup-node 会调 pnpm 算 store 路径，Node 20 下直接报
          # ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite）。
          node-version: 22
          cache: pnpm
      # --ignore-scripts：本 workflow 只需要 typescript 做 AST 解析与 tsc，
      # 跳过 node-pty 之类原生构建（省时且免装编译工具链）。
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 契约断言
        run: pnpm check:contract
      - name: 环境变量不得影响产物（敌意环境回归）
        # 回归 2026-09-25 那次「发布包打进 development 构建」：构建模式必须只认显式开关。
        #
        # 为什么**不**在这里比对仓库提交的产物：字节可复现是「同机」性质——本仓产物在
        # macOS 上构建，Linux 重建后 client.js/client-terminal.js/client-office.js 等
        # 全部字节不同（2026-09-25 实测，本步骤首版就是这么挂的）。跨平台比字节必然红。
        # 所以改成**同一台机器上三种构建互比**，它同样能钉住这条不变量：
        #   ① 无 NODE_ENV 的构建 == 带敌意 NODE_ENV 的构建   （环境不得影响产物）
        #   ② 显式 KCODER_BUILD_MODE=development 必须产出**不同**字节 （开关仍有效，防被改坏）
        # 同机字节比对仍是发版门的一部分：本仓 `prepack` → `check:artifacts`（本地强制）。
        run: |
          set -euo pipefail
          pnpm build
          cp lib/client-office.js /tmp/base.js
          NODE_ENV=development pnpm build
          cmp /tmp/base.js lib/client-office.js && echo '① 敌意 NODE_ENV 不影响产物 ✓'
          KCODER_BUILD_MODE=development pnpm build
          if cmp -s /tmp/base.js lib/client-office.js; then
            echo '::error::② KCODER_BUILD_MODE=development 未生效（产物与 production 相同）'
            exit 1
          fi
          echo '② 显式 dev 开关仍有效 ✓'
      - name: 类型检查
        run: pnpm typecheck
