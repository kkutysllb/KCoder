appId: com.kcoder.app
productName: KCoder
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: ../python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!.venv/**/*"
      - "!.langgraph_api/**/*"
      - "!.qilin/**/*"
      - "!.env"
      - "!**/__pycache__/**/*"
      - "!**/*.pyc"
      - "!**/*.map"
  # Tray icons (跨平台托盘图标资源；main/tray.ts 通过 process.resourcesPath/build/tray/ 引用)
  - from: build/tray
    to: build/tray
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Development
  icon: build/icons
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: true
nodeGypRebuild: false
